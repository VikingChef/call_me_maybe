[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Constrained function-calling system using a local language model"
readme = "README.md"
authors = [
    { name = "rrasmuss", email = "rrasmuss@student.42berlin.de" }
]
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]

[tool.uv]
constraint-dependencies = [
    "torch==2.11.0",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }
